# Dependabot: Diffbot-owned packages and GitHub Actions only, kept low-noise.
# Floor rule: change a range only when it would not pick up the new release on a
# fresh install. Keep this file in the same shape as the other Diffbot repos.
version: 2
updates:
  # GitHub Actions used by .github/workflows. One grouped PR a month at most.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
